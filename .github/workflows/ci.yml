name: ci

# 0.1.16 shipped an `import fcntl` and could not start on Windows at all, because
# nothing here had ever been run on Windows. The matrix below is the fix for that.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The manifest asks for 3.11 and that is what the farm looks for.
          python-version: "3.11"

      - name: A setuptools that understands the license field
        # pyproject declares its licence the PEP 639 way, which setuptools learned in 77.
        # The runners ship whatever they ship, and one test builds a wheel in process.
        run: python -m pip install --upgrade "setuptools>=77" wheel

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Start it the way the farm does
        # Named on its own because this is the check 0.1.17 did not have. The selfcheck
        # below forces the echo model and never looks for a device; farm start does
        # neither, and that is the path that failed on a tester's Windows machine while
        # every job here was green. It also runs inside the suite above; it is repeated
        # here so a red Windows job says which thing broke without reading the log.
        run: python -m unittest discover -s tests -p "test_farm_start.py" -v

      - name: Offline selfcheck
        # A bare --selfcheck answers on the echo model, so this needs no Tiiny and no
        # network: it measures that the app imports, binds, serves and replies.
        run: python -m lite --selfcheck
