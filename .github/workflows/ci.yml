name: ci

# 0.1.16 shipped an `import fcntl` and could not start on Windows at all, because
# nothing here had ever been run on Windows. The matrix below is the fix for that.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The manifest asks for 3.11 and that is what the farm looks for.
          python-version: "3.11"

      - name: A setuptools that understands the license field
        # pyproject declares its licence the PEP 639 way, which setuptools learned in 77.
        # The runners ship whatever they ship, and one test builds a wheel in process.
        run: python -m pip install --upgrade "setuptools>=77" wheel

      - name: What a busy port reports here
        # TEMPORARY. The Windows job says "cannot bind" where it should say "port is
        # busy", and the errno behind that is not written down anywhere reliable.
        if: always()
        run: |
          python -c "
          import errno, socket
          listener = socket.socket()
          listener.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          listener.bind(('127.0.0.1', 0))
          listener.listen()
          port = listener.getsockname()[1]
          try:
              probe = socket.create_connection(('127.0.0.1', port), timeout=0.2)
              probe.close()
              print('connect to the listener: ok')
          except OSError as e:
              print('connect to the listener FAILED', e.errno, getattr(e, 'winerror', None), e)
          for bind_to in ('0.0.0.0', '127.0.0.1'):
              second = socket.socket()
              try:
                  second.bind((bind_to, port))
                  print('bind', bind_to, 'SUCCEEDED beside the listener')
              except OSError as e:
                  print('bind', bind_to, 'errno', e.errno, 'winerror', getattr(e, 'winerror', None), e)
              second.close()
          print('EADDRINUSE', errno.EADDRINUSE, 'WSAEADDRINUSE', getattr(errno, 'WSAEADDRINUSE', None), 'WSAEACCES', getattr(errno, 'WSAEACCES', None))
          "

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Offline selfcheck
        # A bare --selfcheck answers on the echo model, so this needs no Tiiny and no
        # network: it measures that the app imports, binds, serves and replies.
        run: python -m lite --selfcheck
