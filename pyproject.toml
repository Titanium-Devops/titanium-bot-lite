[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "titanium-bot-lite"
description = "Titanium Tiiny Bot, a small local assistant for the Tiiny AI Pocket Lab."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Titanium Computing" }]
keywords = ["tiiny", "assistant", "local", "offline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Topic :: Communications :: Chat",
]
# The single source of the version is lite/VERSION, the same file scripts/release.py reads.
dynamic = ["version"]
# Nothing to install beside Python itself; the whole app is the standard library.
dependencies = []

[project.urls]
Homepage = "https://titanium.bot"
Repository = "https://github.com/Titanium-Devops/titanium-bot-lite"

[project.scripts]
# Never "tiiny": the official Tiiny CLI and the unrelated tiiny-sdk package both claim that name.
titanbot-lite = "lite.server:main"

[tool.setuptools.dynamic]
version = { file = "lite/VERSION" }

# The console and the seeds are data directories inside the package rather than import
# targets, so they are found as namespace packages and their files ride along.
[tool.setuptools.packages.find]
where = ["."]
include = ["lite", "lite.*"]
exclude = ["lite.data*", "lite.vendor*"]
namespaces = true

[tool.setuptools.package-data]
lite = ["VERSION", "tools.json"]
"*" = ["*.html", "*.css", "*.js", "*.json", "*.md", "*.svg", "*.png", "*.webp"]

# The exclusions scripts/release.py enforces, for the parts of them that can live inside the package.
[tool.setuptools.exclude-package-data]
lite = [
    "data/**",
    "vendor/**",
    "tests/**",
    "**/__pycache__/**",
    "**/*.pyc",
    "**/*.pyo",
    "**/.DS_Store",
]
